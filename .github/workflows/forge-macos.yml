name: Forge macOS

# Builds Rhino Forge for macOS - the app, the VST3 and the AU, each universal
# for Apple Silicon and Intel - and packs them into one installer, kept as the
# run's artifact. It then installs that package on the runner and has Apple's
# auval load and play the installed AU, so a run that passes has proved the
# installer, not only the build. Signed ad hoc only; see
# instruments/rhino-forge/packaging/macos/build-pkg.sh for what that means for
# whoever installs it.
#
# A run from main that passes also replaces the public pre-release
# forge-macos-latest with its package, because an artifact downloads only for
# someone signed in to GitHub and a release asset downloads for anyone.

on:
  push:
    branches: [main]
    paths:
      - 'instruments/rhino-forge/**'
      - 'native/scripts/fetch-dependencies.py'
      - '.github/workflows/forge-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-macos-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # An explicit bash runs with pipefail, so a build piped through tee still
    # fails the step.
    shell: bash

env:
  PACKAGE: Rhino Forge.pkg

jobs:
  build:
    # Named rather than macos-latest, so a new image arrives as a deliberate
    # change. macos-14 was retired: a run on it is cancelled before it starts.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUILD: instruments/rhino-forge/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache JUCE and zstd
        uses: actions/cache@v4
        with:
          path: native/.deps
          key: native-deps-${{ hashFiles('native/scripts/fetch-dependencies.py') }}

      - name: Fetch JUCE and zstd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python native/scripts/fetch-dependencies.py

      - name: Configure
        run: >
          cmake -S instruments/rhino-forge -B "$BUILD"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_TESTING=OFF
          2>&1 | tee configure.log

      # make's -k carries on past a file that fails, so one run reports every
      # file clang refuses rather than the first.
      - name: Build
        run: >
          cmake --build "$BUILD" --parallel 4
          --target RhinoForge_Standalone RhinoForge_VST3 RhinoForge_AU
          -- -k
          2>&1 | tee build.log

      - name: Package
        run: |
          find "$BUILD/RhinoForge_artefacts" -maxdepth 3 2>&1 | tee package.log
          bash instruments/rhino-forge/packaging/macos/build-pkg.sh \
            "$BUILD/RhinoForge_artefacts/Release" "$PACKAGE" 2>&1 | tee -a package.log

      - uses: actions/upload-artifact@v4
        with:
          name: Rhino-Forge-macOS
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 30

      - name: Install the package and validate the AU
        run: |
          {
            sudo installer -pkg "$PACKAGE" -target /
            ls -d "/Applications/Rhino Forge.app" \
              "/Library/Audio/Plug-Ins/VST3/Rhino Forge.vst3" \
              "/Library/Audio/Plug-Ins/Components/Rhino Forge.component/Contents/Resources/Factory"
            auval -v aumu Frge Rhno
          } 2>&1 | tee install.log
          # Required in so many words, not left to auval's exit status.
          grep -q 'AU VALIDATION SUCCEEDED' install.log

      # Opens the installed app and quits it the way a person does, and fails
      # if macOS wrote a crash report for it - the first thing a real Mac showed
      # was a crash on every quit - printing the crashed thread. An app that
      # does not quit is only warned about: a permission prompt nobody can
      # answer on the runner could be what holds it.
      - name: Open and quit the app
        run: |
          {
            marker=$(mktemp)
            open "/Applications/Rhino Forge.app"
            sleep 15
            pgrep -x "Rhino Forge" >/dev/null || { echo "the app was not running 15 s after it was opened"; exit 1; }
            osascript -e 'quit app "Rhino Forge"' || true
            for _ in $(seq 30); do pgrep -x "Rhino Forge" >/dev/null || break; sleep 1; done
            if pgrep -x "Rhino Forge" >/dev/null; then
              echo "::warning title=Rhino Forge did not quit::still running 30 s after it was asked to quit"
              pkill -9 -x "Rhino Forge" || true
            fi
            # ReportCrash writes its report a moment after the process ends.
            sleep 10
            reports=$(find ~/Library/Logs/DiagnosticReports -name 'Rhino Forge*' -newer "$marker" 2>/dev/null)
            if [[ -n $reports ]]; then
              report=$(echo "$reports" | head -n 1)
              echo "crashed on quit: $report"
              python3 - "$report" <<'PY'
          import json, sys
          header, body = open(sys.argv[1], encoding='utf-8').read().split('\n', 1)
          crash = json.loads(body)
          print(json.dumps(crash.get('exception', {})))
          images = crash.get('usedImages', [])
          thread = crash['threads'][crash['faultingThread']]
          for frame in thread['frames'][:30]:
              index = frame.get('imageIndex')
              image = images[index].get('name', '?') if index is not None and index < len(images) else '?'
              print(image, frame.get('symbol', hex(frame.get('imageOffset', 0))))
          PY
              exit 1
            fi
            echo "quit cleanly"
          } 2>&1 | tee quit.log

      # Whatever failed is put on the run's page as one annotation, readable
      # there and through the API without signing in, which a run's log is
      # not: a configure or compile by its error lines (clang compiles a
      # universal file once per architecture, so the second copy of each is
      # dropped), packaging and installing by the end of what they printed.
      - name: Report errors
        if: failure()
        run: |
          errors=$(cat configure.log build.log 2>/dev/null \
            | grep -E 'error:|CMake Error' | cut -c1-400 | awk '!seen[$0]++' | head -60 || true)
          for log in package.log install.log quit.log; do
            if [[ -f $log ]]; then
              errors+=$'\n'"--- end of $log"$'\n'$(tail -n 30 "$log" | cut -c1-400)
            fi
          done
          if [[ -n $errors ]]; then
            errors=${errors//'%'/'%25'}
            errors=${errors//$'\r'/'%0D'}
            errors=${errors//$'\n'/'%0A'}
            echo "::error title=Forge macOS build failed::$errors"
          fi

  # Its own job so that the write permission it needs is never held by the
  # build, which runs compilers and third-party code. It runs only after the
  # build job, so only a package that installed and passed auval is published.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: forge-macos-latest
      # A release asset's name may not hold a space; GitHub would make it a dot.
      ASSET: Rhino-Forge-macOS.pkg
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rhino-Forge-macOS

      # Replaced rather than edited, so the tag moves to the commit built and
      # the release page always says which one that was. Its address, and the
      # asset's, stay the same.
      - name: Replace the test build release
        run: |
          mv "$PACKAGE" "$ASSET"
          short=${GITHUB_SHA:0:7}
          cat > notes.md <<EOF
          An unsigned test build of Rhino Forge for macOS 11 or later, universal for Apple Silicon and Intel, built from commit ${short}. It is replaced by every push to \`main\` that changes Forge.

          **${ASSET}** installs the standalone app into Applications and the VST3 and AU into /Library/Audio/Plug-Ins.

          It is not signed with an Apple Developer ID, so macOS refuses it the first time. Open **System Settings → Privacy & Security**, choose **Open Anyway** beside the message about the package, and enter your password.

          Rhino Forge is free software under the GNU AGPL 3.0 or later. Its source is this repository at commit ${GITHUB_SHA}; see [LICENSE](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/LICENSE), and [THIRD_PARTY_NOTICES.md](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/THIRD_PARTY_NOTICES.md) for the work it includes under other licences.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$ASSET" \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Rhino Forge for macOS (test build)" \
            --notes-file notes.md
          echo "::notice title=Published::https://github.com/${GH_REPO}/releases/download/${TAG}/${ASSET}"
